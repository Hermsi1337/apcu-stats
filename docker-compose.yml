services:
  apcu-stats:
    build:
      context: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      APCU_STATS_USER: ${APCU_STATS_USER:-admin}
      APCU_STATS_PASS: ${APCU_STATS_PASS:-change-me}

  test:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    command: ["bash", "tests/run-integration.sh"]
